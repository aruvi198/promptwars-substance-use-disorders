<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUD Recovery & Prevention Platform - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-icon">�</span>
            <span class="logo-text">You Can</span>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card glass-container">
            <h1 class="login-title">Welcome to Aegis</h1>
            <p class="login-subtitle">A GenAI Recovery & Prevention Ecosystem</p>
            <p class="login-subtitle" style="margin-bottom: 0.5rem; color: #fbbf24;">Demo login: demo@aegis.local / Demo123!</p>
            <p class="login-subtitle" style="margin-bottom: 1.25rem; color: #fde68a;">Caretaker login: caretaker@aegis.local / Caretaker123!</p>

            {% if error %}
                <p class="form-error" role="alert">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('login_page') }}" method="POST" novalidate>
                <input type="hidden" name="role" id="selected-role" value="hero">
                
                <fieldset class="role-selector" aria-label="Choose your role">
                    <legend class="sr-only">Choose your role</legend>
                    <button type="button" class="role-option selected" data-role="hero" aria-pressed="true">
                        <span class="role-icon" aria-hidden="true">🌱</span>
                        <span class="role-label">Recovery Hero</span>
                    </button>
                    <button type="button" class="role-option" data-role="caretaker" aria-pressed="false">
                        <span class="role-icon" aria-hidden="true">🤝</span>
                        <span class="role-label">Care Buddy</span>
                    </button>
                </fieldset>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="input-field" placeholder="you@example.com" autocomplete="email" maxlength="120">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="input-field" placeholder="Create or enter a password" autocomplete="current-password" maxlength="120">
                </div>

                <div class="input-group">
                    <label for="username">Your Name</label>
                    <input type="text" name="username" id="username" class="input-field" placeholder="Enter your name..." autocomplete="name" value="Alex" maxlength="80">
                </div>

                <button type="submit" class="btn-primary">Enter Dashboard</button>
            </form>
        </div>
    </main>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
