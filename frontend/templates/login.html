<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUD Recovery & Prevention Platform - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-icon">🔆</span>
            <span class="logo-text">Aegis Recovery</span>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card glass-container">
            <h1 class="login-title">Welcome to Aegis</h1>
            <p class="login-subtitle">A GenAI Recovery & Prevention Ecosystem</p>

            <form action="{{ url_for('login_page') }}" method="POST">
                <input type="hidden" name="role" id="selected-role" value="hero">
                
                <div class="role-selector">
                    <div class="role-option selected" data-role="hero">
                        <span class="role-icon">🌱</span>
                        <span class="role-label">Recovery Hero</span>
                    </div>
                    <div class="role-option" data-role="caretaker">
                        <span class="role-icon">🤝</span>
                        <span class="role-label">Caregiver</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">Your Name</label>
                    <input type="text" name="username" id="username" class="input-field" placeholder="Enter your name..." required value="Alex">
                </div>

                <button type="submit" class="btn-primary">Enter Dashboard</button>
            </form>
        </div>
    </main>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
